name: Promote to production (reusable)

# Reusable "promote to production" workflow.
#
# Reads the tag currently deployed to staging from the infrastructure
# repository's kustomization, copies that image from the staging registry
# to the production registry (both `:tag` and `:latest`), and updates the
# production deployment.

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name, e.g. robotics/sara-anonymizer."
        required: true
        type: string
      staging_registry:
        required: true
        type: string
      production_registry:
        required: true
        type: string
      infrastructure_repository:
        required: true
        type: string
      author_name:
        required: true
        type: string
      use_oidc:
        description: >
          Authenticate to both registries with a GitHub OIDC token exchanged for
          the robotics production push identity, instead of registry
          username/passwords. That identity needs AcrPull on the staging
          registry and AcrPush on the production one, because the copy reads
          from staging and writes to production. Requires `environment`, and
          the calling job must grant `id-token: write`.
        required: false
        type: boolean
        default: false

      environment:
        description: >
          GitHub Environment the copy job runs in. Scopes `vars` lookups and is
          what the OIDC subject claim carries. Only needed with use_oidc.
        required: false
        type: string
        default: ""

      azure_subscription_id:
        description: "Subscription holding both registries. Only needed with use_oidc."
        required: false
        type: string
        default: ""

      runs_on:
        description: "Runner label for the image-copy job (e.g. 'ubuntu-latest' or a self-hosted runner label). The deployment update job always uses ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
      kustomization_base_path:
        description: "Base path (inside the infrastructure repo) that contains the per-env overlay directories. The workflow reads the staging tag from '<kustomization_base_path>/staging/kustomization.yaml' and updates '<kustomization_base_path>/production/kustomization.yaml'. Defaults to 'k8s_kustomize/overlays' for backwards compatibility."
        required: false
        type: string
        default: "k8s_kustomize/overlays"
    secrets:
      staging_registry_username:
        required: false
      staging_registry_password:
        required: false
      production_registry_username:
        required: false
      production_registry_password:
        required: false
      deploy_key:
        required: true

permissions:
  contents: read
  packages: write
  # Required so the copy job can mint an OIDC token on the use_oidc path.
  id-token: write

jobs:
  get-staging-version:
    name: Get version currently in staging
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.get.outputs.tag }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          ref: main
          repository: ${{ inputs.infrastructure_repository }}
          ssh-key: ${{ secrets.deploy_key }}

      - name: Read staging tag from kustomization
        id: get
        run: |
          KUSTOMIZATION=${{ inputs.kustomization_base_path }}/staging/kustomization.yaml
          IMAGE_LINE=$(grep -n "newName: ${{ inputs.staging_registry }}/${{ inputs.image_name }}$" "$KUSTOMIZATION" | cut -d: -f1)
          if [ -z "$IMAGE_LINE" ]; then
            echo "Error: image ${{ inputs.staging_registry }}/${{ inputs.image_name }} not found in $KUSTOMIZATION"
            exit 1
          fi
          TAG_LINE=$((IMAGE_LINE + 1))
          VERSION_TAG=$(sed -n "${TAG_LINE}p" "$KUSTOMIZATION" | awk -F': ' '{print $2}' | tr -d ' ')
          if [ -z "$VERSION_TAG" ]; then
            echo "Error: could not parse newTag on line ${TAG_LINE} of $KUSTOMIZATION"
            exit 1
          fi
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

  copy-image-to-production:
    name: Copy staging image to production registry
    needs: get-staging-version
    runs-on: ${{ inputs.runs_on }}
    # Empty unless use_oidc is set, which GitHub treats as "no environment".
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Only consumed on the OIDC path, but permissions cannot be conditional.
      # Callers must grant it too - a called workflow's token can never exceed
      # the calling job's.
      id-token: write
    steps:
      - name: Log in to staging registry
        if: ${{ !inputs.use_oidc }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ${{ inputs.staging_registry }}
          username: ${{ secrets.staging_registry_username }}
          password: ${{ secrets.staging_registry_password }}

      - name: Log in to production registry
        if: ${{ !inputs.use_oidc }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ${{ inputs.production_registry }}
          username: ${{ secrets.production_registry_username }}
          password: ${{ secrets.production_registry_password }}

      - name: Azure login (OIDC / federated credential)
        if: ${{ inputs.use_oidc }}
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 #v2.3.0
        with:
          client-id: ${{ vars.ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      # Two logins, one identity: the copy reads from staging and writes to
      # production, so the identity holds AcrPull on the former and AcrPush
      # on the latter.
      - name: Log in to both registries with the federated token
        if: ${{ inputs.use_oidc }}
        run: |
          az acr login --name "${STAGING_REGISTRY%%.*}"
          az acr login --name "${PRODUCTION_REGISTRY%%.*}"
        env:
          STAGING_REGISTRY: ${{ inputs.staging_registry }}
          PRODUCTION_REGISTRY: ${{ inputs.production_registry }}

      - name: Copy image (tag + latest) from staging to production
        env:
          TAG: ${{ needs.get-staging-version.outputs.version_tag }}
        run: |
          docker buildx imagetools create \
            --tag ${{ inputs.production_registry }}/${{ inputs.image_name }}:${TAG} \
            --tag ${{ inputs.production_registry }}/${{ inputs.image_name }}:latest \
            ${{ inputs.staging_registry }}/${{ inputs.image_name }}:${TAG}

  deploy:
    name: Update deployment in production
    needs: [get-staging-version, copy-image-to-production]
    uses: ./.github/workflows/update_kubernetes_deployment.yml
    with:
      environment: production
      registry: ${{ inputs.production_registry }}
      image_name: ${{ inputs.image_name }}
      tag: ${{ needs.get-staging-version.outputs.version_tag }}
      author_name: ${{ inputs.author_name }}
      infrastructure_repository: ${{ inputs.infrastructure_repository }}
      kustomization_base_path: ${{ inputs.kustomization_base_path }}
    secrets:
      deploy_key: ${{ secrets.deploy_key }}
