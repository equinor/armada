name: Run alembic migrations

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: "PR head commit SHA to checkout (set to skip default ref checkout)"
        required: false
        type: string
        default: ""
      environment:
        description: "Target environment (Development, Staging, Production)"
        required: true
        type: string
      checkout_ref:
        description: "Git ref to checkout (tag, branch, or SHA)"
        required: false
        type: string
        default: "main"
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.14"
    secrets:
      client_id:
        required: true
      client_secret:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  run_migrations:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
        with:
          ref: ${{ inputs.pr_head_sha || inputs.checkout_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 #v10.3.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Update database
        run: uv run --frozen --extra dev alembic upgrade head
        env:
          AZURE_CLIENT_ID: ${{ secrets.client_id }}
          AZURE_CLIENT_SECRET: ${{ secrets.client_secret }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
