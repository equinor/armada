# Validates EF Core migrations against a real PostgreSQL container to catch provider-specific SQL errors.
# Runs "dotnet ef database update" to ensure the full migration history applies successfully.
# On pull_request and merge_group events it also requires new migrations to be newer than the latest
# migration on the target branch.

name: Validate dotnet migrations against temporary database

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET SDK version to use"
        required: false
        type: string
        default: "10.0.x"

      working_directory:
        description: "Directory containing the .NET project/solution to validate (Ex: 'api')"
        required: true
        type: string

# Permissions must be provided from calling workflow
permissions:
  contents: read

jobs:
  validate-migrations-temp-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Set up temporary database
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      # Checks out the scripts that belong to this reusable workflow, at the same commit as the workflow
      - name: Checkout workflow scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          repository: ${{ job.workflow_repository || 'equinor/armada' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .armada-workflow-scripts
          sparse-checkout: .github/scripts
          persist-credentials: false

      # New migrations must sort after the latest migration on the target branch. Otherwise fresh and
      # existing databases apply migrations in different orders, e.g. when a migration created before
      # another merged migration is merged afterwards without being regenerated
      - name: Check migration order against target branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MIGRATIONS_DIR: ${{ inputs.working_directory }}/Migrations
        run: |
          if [ -z "${BASE_SHA}" ]; then
            echo "::notice::No target branch for event '${{ github.event_name }}', skipping migration order check"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          python3 .armada-workflow-scripts/.github/scripts/check_dotnet_migration_order.py \
            --base "${BASE_SHA}" \
            --head HEAD \
            --migrations-dir "${MIGRATIONS_DIR}"

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Install dotnet ef tool
        run: |
          DOTNET_EF_VERSION="${{ inputs.dotnet_version }}"
          DOTNET_EF_VERSION="${DOTNET_EF_VERSION/x/*}"
          dotnet tool install -g dotnet-ef --version "${DOTNET_EF_VERSION}"

      - name: Build API
        working-directory: ${{ inputs.working_directory }}
        run: dotnet build

      # Checking has-pending-model-changes should check if there are other changes that are not in the migrations
      # This could be the case if two migrations are worked on in parallel and one is merged before the other, 
      # causing the second to have pending model changes that are not yet in a migration after rebase
      - name: Check for Pending Model Changes
        working-directory: ${{ inputs.working_directory }}
        env:
          Database__postgresConnectionString: "Host=localhost;Port=5432;Database=test_db;Username=postgres;Password=password;Include Error Detail=true"
          ASPNETCORE_ENVIRONMENT: "Development"
        run: dotnet ef migrations has-pending-model-changes

      - name: Run migrations against temporary database
        working-directory: ${{ inputs.working_directory }}
        env:
          Database__postgresConnectionString: "Host=localhost;Port=5432;Database=test_db;Username=postgres;Password=password;Include Error Detail=true"
          ASPNETCORE_ENVIRONMENT: "Development"
        run: |
          dotnet ef database update --no-build --verbose
