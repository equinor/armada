name: Publish existing release images to staging

on:
  workflow_call:
    inputs:
      image_name:
        description: "Primary image path, for example robotics/sara"
        required: true
        type: string
      paired_image_name:
        description: "Optional migration image from the same source commit"
        required: false
        type: string
        default: ""
      tag:
        description: "Stable release tag in vX.Y.Z format"
        required: true
        type: string
      push_to_ghcr:
        description: "Publish the primary image as a public GHCR release"
        required: false
        type: boolean
        default: false
      azure_subscription_id:
        required: true
        type: string
    outputs:
      is_latest:
        description: "Whether this is the newest stable release and should deploy"
        value: ${{ jobs.publish.outputs.is_latest }}
      digest:
        value: ${{ jobs.publish.outputs.digest }}
      paired_digest:
        value: ${{ jobs.publish.outputs.paired_digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Staging
    outputs:
      is_latest: ${{ steps.publish.outputs.is_latest }}
      digest: ${{ steps.publish.outputs.digest }}
      paired_digest: ${{ steps.publish.outputs.paired_digest }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.tag }}

      - name: Verify the published release commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]] || { echo "Release tag no longer matches the published commit" >&2; exit 1; }

      - name: Check out release publishing tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: equinor/armada
          ref: main
          path: release-tools
          sparse-checkout: .github/scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Sign in to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.ACR_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Log in to development and staging registries
        run: |
          az acr login --name roboticsdevacr
          az acr login --name roboticsstagingacr

      - name: Log in to GHCR
        if: inputs.push_to_ghcr
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the verified commit images without rebuilding
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REGISTRY: roboticsdevacr.azurecr.io
          DESTINATION_REGISTRY: roboticsstagingacr.azurecr.io
          IMAGE_NAME: ${{ inputs.image_name }}
          PAIRED_IMAGE_NAME: ${{ inputs.paired_image_name }}
          PUSH_TO_GHCR: ${{ inputs.push_to_ghcr }}
        run: python3 release-tools/.github/scripts/publish_release_images.py
