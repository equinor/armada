name: Build and publish docker image to container registry


on:
  workflow_call:
    inputs:
      registry:
        description: "The container registry to upload to"
        required: true
        type: string
        default: "ghcr.io"

      image_name:
        description: "Name of the image to publish"
        required: true
        type: string

      tag:
        description: "Tag to apply to the published image"
        required: true
        type: string

      secondary_tag:
        description: "Secondary tag to apply to the published image (e.g., latest)"
        required: false
        type: string

      path_to_dockerfile:
        description: "Path to the Dockerfile to build"
        required: false
        type: string
        default: "Dockerfile"

      path_to_context:
        description: "Path to the build context for the Docker build action"
        required: false
        type: string
        default: "."

      runs_on:
        description: "Runner to execute the job on (e.g. 'ubuntu-latest' or a self-hosted runner label)."
        required: false
        type: string
        default: "ubuntu-latest"

      push_to_ghcr:
        description: >
          Additionally publish the image to ghcr.io/<owner>/<name> in the same
          build. Only for public repositories: GHCR packages must be public for
          other repositories to pull them without a stored credential. Never
          enable for an image that bundles licensed third-party software.
        required: false
        type: boolean
        default: false

    secrets:
      registry_username:
        description: "Username for container registry"
        required: true

      registry_password:
        description: "Password for container registry"
        required: true

      anymal_download_password:
        description: "Password to download software during build. Only required for isar-anymal."
        required: false

      anymal_download_username:
        description: "Username to download software during build. Only required for isar-anymal."
        required: false


# Permissions must be provided from calling workflow
permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker-image-to-container-registry:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6

      - name: Set up Docker Buildx # This enables caching of built layers
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Log in to ghcr.io
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GHCR has no nested repositories, so the ACR path's trailing segment is
      # used under the owner: robotics/isar-robot -> ghcr.io/equinor/isar-robot.
      - name: Determine image references
        id: refs
        run: |
          {
            echo "images<<EOF"
            echo "${{ inputs.registry }}/${{ inputs.image_name }}"
            if [ "${{ inputs.push_to_ghcr }}" = "true" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}" |
                sed 's#\(ghcr.io/[^/]*/\).*/#\1#'
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf #v6
        with:
          images: ${{ steps.refs.outputs.images }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=${{ inputs.secondary_tag }},enable=${{ inputs.secondary_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 #v7
        with:
          context: ${{ inputs.path_to_context }}
          file: ${{ inputs.path_to_dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ secrets.anymal_download_password != '' && format('ANYMAL_DOWNLOAD_PASSWORD_SECRET={0}', secrets.anymal_download_password) || '' }}
          build-args: ${{ secrets.anymal_download_username != '' && format('ANYMAL_DOWNLOAD_USER_NAME={0}', secrets.anymal_download_username) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max