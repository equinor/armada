name: Update Kubernetes deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (development, staging, or production)"
        required: true
        type: string

      tag:
        description: "Image tag to deploy"
        required: true
        type: string

      registry:
        description: "Container registry URL (e.g. ghcr.io, auroraprodacr.azurecr.io)"
        required: true
        type: string

      image_name:
        description: "Exact image name as it appears after newName in kustomization.yaml"
        required: true
        type: string

      paired_image_name:
        description: "Optional second image to update to the same tag in one commit. Supply both digests when pinning a pair."
        required: false
        type: string
        default: ""

      digest:
        description: "Optional immutable digest for the primary image; pinned updates require a paired image and its digest."
        required: false
        type: string
        default: ""

      paired_image_digest:
        description: "Optional immutable digest for the paired image."
        required: false
        type: string
        default: ""

      author_name:
        description: "Git commit author name"
        required: true
        type: string

      author_email:
        description: "Git commit author email"
        required: false
        type: string

      infrastructure_repository:
        description: "Target infrastructure repository (e.g. equinor/robotics-infrastructure)"
        required: true
        type: string

      commit_message_service_name:
        description: "Human-readable service name for the commit message. Defaults to image_name if not set."
        required: false
        type: string

      kustomization_base_path:
        description: "Base path (inside the infrastructure repo) that contains the per-env overlay directories. The workflow edits '<kustomization_base_path>/<environment>/kustomization.yaml'. Defaults to 'k8s_kustomize/overlays' for backwards compatibility."
        required: false
        type: string
        default: "k8s_kustomize/overlays"

    secrets:
      deploy_key:
        description: "SSH deploy key for the target infrastructure repository"
        required: true

# Permissions must be provided from calling workflow
permissions:
  contents: read

jobs:
  update-deployment:
    name: Update deployment
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ inputs.author_email }}
      NAME: ${{ inputs.author_name }}
      SERVICE_NAME: ${{ inputs.commit_message_service_name || inputs.image_name }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
        with:
          ref: main
          repository: ${{ inputs.infrastructure_repository }}
          ssh-key: ${{ secrets.deploy_key }}

      - name: Update image tag and push
        env:
          KUSTOMIZATION_BASE_PATH: ${{ inputs.kustomization_base_path }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          PAIRED_IMAGE_NAME: ${{ inputs.paired_image_name }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          PAIRED_IMAGE_DIGEST: ${{ inputs.paired_image_digest }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          git config --global user.email "${EMAIL}"
          git config --global user.name  "GitHub Actions (${NAME})"

          KUSTOMIZATION_FILE="${KUSTOMIZATION_BASE_PATH}/${TARGET_ENVIRONMENT}/kustomization.yaml"

          apply_edit() {
            local image_name="${1:-$IMAGE_NAME}"
            GREP_RESULT=$(grep -n "newName: ${REGISTRY}/${image_name}$" "$KUSTOMIZATION_FILE" | cut -d ':' -f 1)
            if [ -z "$GREP_RESULT" ]; then
              echo "Error: Image ${REGISTRY}/${image_name} not found in $KUSTOMIZATION_FILE"
              return 1
            fi
            LINE_NUMBERS=($GREP_RESULT)
            for line_number in "${LINE_NUMBERS[@]}"; do
              TAG_LINE_NUMBER=$((line_number + 1))
              sed -i "${TAG_LINE_NUMBER} s/newTag:.*/newTag: ${IMAGE_TAG}/" "$KUSTOMIZATION_FILE"
            done
          }

          check_unpinned_pair() {
            local image_name line_number tag_line
            for image_name in "$IMAGE_NAME" "$PAIRED_IMAGE_NAME"; do
              line_number=$(grep -n -x "  newName: ${REGISTRY}/${image_name}" "$KUSTOMIZATION_FILE" | cut -d ':' -f 1)
              if [[ ! "$line_number" =~ ^[0-9]+$ ]]; then
                echo "Expected exactly one image entry for ${REGISTRY}/${image_name}" >&2
                return 1
              fi
              tag_line=$(sed -n "$((line_number + 1))p" "$KUSTOMIZATION_FILE")
              if [[ "$tag_line" != "  newTag: "* ]]; then
                echo "Expected newTag immediately after ${REGISTRY}/${image_name}" >&2
                return 1
              fi
              if ! awk -v name="${REGISTRY}/${image_name}" '
                $0 == "  newName: " name { in_image = 1; next }
                in_image && /^[^ ]/ { exit }
                in_image && /^  digest:/ { found_digest = 1; exit }
                END { if (found_digest) exit 1 }
              ' "$KUSTOMIZATION_FILE"; then
                echo "Remove pinned digest for ${REGISTRY}/${image_name} before updating tags" >&2
                return 1
              fi
            done
          }

          update_pinned_pair() {
            python3 - "$KUSTOMIZATION_FILE" <<'PY'
          import os
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as config_file:
              content = config_file.read()

          for name, digest in (
              (os.environ["IMAGE_NAME"], os.environ["IMAGE_DIGEST"]),
              (os.environ["PAIRED_IMAGE_NAME"], os.environ["PAIRED_IMAGE_DIGEST"]),
          ):
              image = f'{os.environ["REGISTRY"]}/{name}'
              # Only the exact image entry may be changed; keep every other
              # service in this shared analytics overlay intact.
              pattern = re.compile(
                  r"(?m)^(- name: [^\n]+\n  newName: " + re.escape(image)
                  + r"\n)(  newTag: [^\n]+\n)(  digest: [^\n]+\n)?"
              )
              matches = list(pattern.finditer(content))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one image entry for {image}")
              content = pattern.sub(
                  lambda match: match.group(1)
                  + f'  newTag: {os.environ["IMAGE_TAG"]}\n  digest: {digest}\n',
                  content,
                  count=1,
              )

          with open(path, "w", encoding="utf-8") as config_file:
              config_file.write(content)
          PY
          }

          if [ -n "$IMAGE_DIGEST" ] || [ -n "$PAIRED_IMAGE_DIGEST" ]; then
            [ -n "$PAIRED_IMAGE_NAME" ] && [ "$IMAGE_NAME" != "$PAIRED_IMAGE_NAME" ] || { echo "Digest pinning requires distinct paired images" >&2; exit 1; }
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$PAIRED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Both valid digests are required for a pinned pair" >&2; exit 1; }
          fi

          # Several services deploy at once and all push to the same
          # infrastructure repository, so a plain push loses the race whenever
          # two land together. Rather than rebasing — the services often edit
          # the same kustomization file, so a rebase can conflict — each attempt
          # discards local work, takes the latest main, and re-applies the edit.
          # The tag edits are targeted and idempotent, so re-applying is safe.
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet

            if [ -n "$IMAGE_DIGEST" ]; then
              update_pinned_pair
            else
              if [ -n "$PAIRED_IMAGE_NAME" ]; then
                [ "$IMAGE_NAME" != "$PAIRED_IMAGE_NAME" ] || { echo "Paired image must differ from primary image" >&2; exit 1; }
                check_unpinned_pair
              fi
              apply_edit
              if [ -n "$PAIRED_IMAGE_NAME" ]; then
                apply_edit "$PAIRED_IMAGE_NAME"
              fi
            fi

            git add "$KUSTOMIZATION_FILE"
            if git diff-index --quiet HEAD; then
              echo "No changes to commit or push."
              exit 0
            fi

            git commit --quiet --message \
              "GHA: Update ${SERVICE_NAME} in ${TARGET_ENVIRONMENT} (${IMAGE_TAG})"

            if git push --quiet; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; another service pushed first. Retrying."
            sleep $(( (RANDOM % 5) + attempt ))
          done

          echo "Error: could not push after 5 attempts."
          exit 1
