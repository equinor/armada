name: Deploy to development (reusable)

# Composes build_and_publish_docker_image_to_container_registry.yml and
# update_kubernetes_deployment.yml into a "publish short-sha image and
# update development kustomize overlay" pipeline.
#
# Scope: single-image services deploying via kustomize to an equinor
# infrastructure repository.

on:
  workflow_call:
    inputs:
      registry:
        description: "Container registry for development images."
        required: true
        type: string
      image_name:
        description: "Image name (e.g. robotics/sara-anonymizer)."
        required: true
        type: string
      infrastructure_repository:
        description: "Target infrastructure repository (kustomize)."
        required: true
        type: string
      path_to_dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      path_to_context:
        required: false
        type: string
        default: "."
      environment_name:
        description: "Optional GitHub Environment to gate the deploy on (e.g. 'Development'). Leave empty to disable the gate."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner label for the image-build job (e.g. 'ubuntu-latest' or a self-hosted runner label). The deployment update job always uses ubuntu-latest."
        required: false
        type: string
        default: "ubuntu-latest"
      kustomization_base_path:
        description: "Base path (inside the infrastructure repo) that contains the per-env overlay directories. Passed through to update_kubernetes_deployment.yml. Defaults to 'k8s_kustomize/overlays' for backwards compatibility."
        required: false
        type: string
        default: "k8s_kustomize/overlays"
      push_to_ghcr:
        description: >
          Additionally publish the image to ghcr.io/<owner>/<name>. Public
          repositories only. Does not affect the registry the deployment is
          rolled out from, which stays the robotics ACR.
        required: false
        type: boolean
        default: false

      use_oidc:
        description: "Publish using GitHub OIDC instead of a registry username/password. See build_and_publish_docker_image_to_container_registry.yml."
        required: false
        type: boolean
        default: false

      azure_subscription_id:
        description: "Subscription holding the registry. Only needed with use_oidc."
        required: false
        type: string
        default: ""

    secrets:
      registry_username:
        description: "Username for the container registry. Not needed when use_oidc is true."
        required: false
      registry_password:
        description: "Password for the container registry. Not needed when use_oidc is true."
        required: false
      deploy_key:
        description: "SSH deploy key for the infrastructure repository."
        required: true

permissions:
  contents: read
  packages: write
  # Required so build_and_publish can mint an OIDC token on the use_oidc path.
  id-token: write

jobs:
  get-short-sha:
    name: Compute short-sha tag
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - id: get-tag
        run: echo "tag=dev.$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish image
    needs: get-short-sha
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build_and_publish_docker_image_to_container_registry.yml
    with:
      registry: ${{ inputs.registry }}
      image_name: ${{ inputs.image_name }}
      tag: ${{ needs.get-short-sha.outputs.tag }}
      path_to_dockerfile: ${{ inputs.path_to_dockerfile }}
      path_to_context: ${{ inputs.path_to_context }}
      runs_on: ${{ inputs.runs_on }}
      push_to_ghcr: ${{ inputs.push_to_ghcr }}
      use_oidc: ${{ inputs.use_oidc }}
      # Scopes `vars` lookups in the publish job and, on the OIDC path, is what
      # the token's subject claim carries. Empty for callers that omit it.
      environment: ${{ inputs.environment_name }}
      azure_subscription_id: ${{ inputs.azure_subscription_id }}
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}

  deploy:
    name: Update deployment in development
    needs: [publish, get-short-sha]
    uses: ./.github/workflows/update_kubernetes_deployment.yml
    with:
      environment: development
      registry: ${{ inputs.registry }}
      image_name: ${{ inputs.image_name }}
      tag: ${{ needs.get-short-sha.outputs.tag }}
      author_email: ${{ github.event.head_commit.author.email }}
      author_name: ${{ github.event.head_commit.author.name }}
      infrastructure_repository: ${{ inputs.infrastructure_repository }}
      kustomization_base_path: ${{ inputs.kustomization_base_path }}
    secrets:
      deploy_key: ${{ secrets.deploy_key }}
