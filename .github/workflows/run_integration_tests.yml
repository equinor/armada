name: Run integration tests

on:
  workflow_call:
    inputs:
      lane:
        description: "Which lane to run (dev or latest)"
        required: true
        type: string
        default: "latest"

      use_ghcr:
        description: >
          Pull the service images from ghcr.io/equinor instead of the robotics
          ACR. The lane still selects the tag. Authenticates with the built-in
          GITHUB_TOKEN, so none of the registry secrets below are needed; the
          caller must grant `packages: read`.
        required: false
        type: boolean
        default: false
    secrets:
        INTEGRATION_TEST_AZURE_CLIENT_SECRET:
          required: true
          description: |
            Azure client secret for the service principal with read access to
            FlotillaTestsKv, which holds the four MQTT credentials. Service-to-service
            tokens come from a local Keycloak realm and need no Azure identity.

        dev_registry_username:
          required: false
          description: |
            Username for roboticsdevacr.azurecr.io. Required for the dev lane
            unless use_ghcr is set; pass ROBOTICS_ROBOTICSDEVACR_USERNAME.

        dev_registry_password:
          required: false
          description: |
            Password for roboticsdevacr.azurecr.io. Required for the dev lane
            unless use_ghcr is set; pass ROBOTICS_ROBOTICSDEVACR_PASSWORD.

        staging_registry_username:
          required: false
          description: |
            Username for roboticsstagingacr.azurecr.io. Required for the latest
            lane unless use_ghcr is set; pass ROBOTICS_ROBOTICSSTAGINGACR_USERNAME.

        staging_registry_password:
          required: false
          description: |
            Password for roboticsstagingacr.azurecr.io. Required for the latest
            lane unless use_ghcr is set; pass ROBOTICS_ROBOTICSSTAGINGACR_PASSWORD.

  workflow_dispatch:
    inputs:
      lane:
        description: "Which lane to run (dev or latest)"
        required: true
        type: string
        default: "latest"
      use_ghcr:
        description: "Pull the service images from ghcr.io/equinor instead of the robotics ACR"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Only used when use_ghcr is set; pulling from ghcr.io authenticates with the
  # built-in GITHUB_TOKEN rather than a stored registry credential.
  packages: read

env:
  # Only MQTT credentials are still read from the key vault; service-to-service
  # authentication runs against a local Keycloak realm.
  KEYVAULT_NAME: FlotillaTestsKv
  AZURE_TENANT_ID: 3aa4a235-b6e2-48d5-9195-7fcf05b459b0
  AZURE_CLIENT_ID: 17d7c036-e4ff-4df6-87fd-0d648a36a727

  # The lane selects the tag: a push to main lands as :dev, a release lands as
  # :latest. Which registry that tag is read from is selected by use_ghcr.
  #
  # The services publish to the robotics ACRs and, since equinor/armada#101, to
  # ghcr.io in the same build. Both carry the same tags, but the paths differ:
  # ghcr.io has no nested repositories, so the robotics/ prefix is dropped there.
  # These are repository paths within a registry, not complete image refs.
  DEV_REGISTRY: roboticsdevacr.azurecr.io
  STAGING_REGISTRY: roboticsstagingacr.azurecr.io
  GHCR_REGISTRY: ghcr.io/equinor
  FLOTILLA_BACKEND_REPOSITORY: robotics/flotilla-backend
  FLOTILLA_BROKER_REPOSITORY: robotics/flotilla-broker
  ISAR_ROBOT_REPOSITORY: robotics/isar-robot
  SARA_REPOSITORY: robotics/sara

  POSTGRESQL_IMAGE: postgres:16
  AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:latest

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: '{"clientId":"${{ env.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.INTEGRATION_TEST_AZURE_CLIENT_SECRET }}","tenantId":"${{ env.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: 'true'

      - name: Retrieve secrets from Key Vault
        id: kv
        shell: bash
        run: |
          echo "Retrieving secrets from Key Vault: $KEYVAULT_NAME"

          # MQTT is username/password, validated by the broker against the hashed
          # passwd_file committed in equinor/flotilla, so these remain real secrets.
          secrets=(
            FLOTILLA-MQTT-PASSWORD
            FLOTILLA-BROKER-SERVER-KEY
            ISAR-MQTT-PASSWORD
            SARA-MQTT-PASSWORD
          )

          for name in "${secrets[@]}"; do
            value=$(az keyvault secret show \
              --vault-name "$KEYVAULT_NAME" \
              --name "$name" \
              --query value -o tsv)
          
            # Mask the value in any future log output
            echo "::add-mask::$value"
          
            # Replace hyphens with underscores and export to env
            safe_name="${name//-/_}"
            echo "${safe_name}=$value" >> $GITHUB_ENV
          done

      - name: Checkout armada repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          repository: equinor/armada
          ref: main
          path: ./integration-tests

      - name: Compose image references
        id: images
        run: |
          TAG="${{ inputs.lane }}"
          if [ "${{ inputs.use_ghcr }}" = "true" ]; then
            # ghcr.io has no nested repositories, so the robotics/ prefix that
            # namespaces the images inside the ACRs is stripped here.
            REGISTRY="${{ env.GHCR_REGISTRY }}"
            PREFIX=""
          elif [ "$TAG" = "dev" ]; then
            REGISTRY="${{ env.DEV_REGISTRY }}"
            PREFIX="robotics/"
          else
            REGISTRY="${{ env.STAGING_REGISTRY }}"
            PREFIX="robotics/"
          fi

          # Take the trailing segment of each repository path and re-apply the
          # prefix the selected registry uses, so the paths stay derived from a
          # single set of env vars rather than duplicated per registry.
          image_ref() {
            echo "${REGISTRY}/${PREFIX}${1##*/}:${TAG}"
          }

          {
            echo "registry=${REGISTRY%%/*}"
            echo "flotilla_backend=$(image_ref '${{ env.FLOTILLA_BACKEND_REPOSITORY }}')"
            echo "flotilla_broker=$(image_ref '${{ env.FLOTILLA_BROKER_REPOSITORY }}')"
            echo "isar_robot=$(image_ref '${{ env.ISAR_ROBOT_REPOSITORY }}')"
            echo "sara=$(image_ref '${{ env.SARA_REPOSITORY }}')"
            echo "postgres=${{ env.POSTGRESQL_IMAGE }}"
            echo "azurite=${{ env.AZURITE_IMAGE }}"
            echo "git_ref=${TAG}"
          } >> $GITHUB_OUTPUT

      - name: Log in to the robotics container registry
        if: ${{ !inputs.use_ghcr }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ${{ steps.images.outputs.registry }}
          username: ${{ inputs.lane == 'dev' && secrets.dev_registry_username || secrets.staging_registry_username }}
          password: ${{ inputs.lane == 'dev' && secrets.dev_registry_password || secrets.staging_registry_password }}

      # The packages are public, so this is not strictly required to pull them.
      # It is done anyway to lift the anonymous pull rate limit.
      - name: Log in to ghcr.io
        if: ${{ inputs.use_ghcr }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b #v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        working-directory: integration-tests
        run: uv sync --frozen

      - name: Run integration tests with pytest
        working-directory: integration-tests
        env:
          FLOTILLA_BACKEND_IMAGE: ${{ steps.images.outputs.flotilla_backend }}
          FLOTILLA_BROKER_IMAGE: ${{ steps.images.outputs.flotilla_broker }}
          POSTGRESQL_IMAGE: ${{ steps.images.outputs.postgres }}
          ISAR_ROBOT_IMAGE: ${{ steps.images.outputs.isar_robot }}
          SARA_IMAGE: ${{ steps.images.outputs.sara }}
          AZURITE_IMAGE: ${{ steps.images.outputs.azurite }}
          GIT_REPOSITORY_FOR_MIGRATIONS_REF: ${{ steps.images.outputs.git_ref }}
          SARA_GIT_REPOSITORY_FOR_MIGRATIONS_REF: ${{ steps.images.outputs.git_ref }}

          FLOTILLA_MQTT_PASSWORD: ${{ env.FLOTILLA_MQTT_PASSWORD }}
          FLOTILLA_BROKER_SERVER_KEY: ${{ env.FLOTILLA_BROKER_SERVER_KEY }}
          ISAR_MQTT_PASSWORD: ${{ env.ISAR_MQTT_PASSWORD }}
          SARA_MQTT_PASSWORD: ${{ env.SARA_MQTT_PASSWORD }}

        run: uv run --frozen pytest -s -n auto robotics_integration_tests
